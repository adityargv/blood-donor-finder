<!DOCTYPE html>
<html>
<head><title>Admin Login</title></head>
<body>
    <h1>Admin Login</h1>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <br><a href="/">Back to Home</a>
</body>
</html>
