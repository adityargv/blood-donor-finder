<!DOCTYPE html>
<html>
<head><title>Admin Panel</title></head>
<body>
    <h1>Admin Panel</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th><th>Name</th><th>Blood Group</th><th>City</th>
            <th>Phone</th><th>Last Donated</th><th>Actions</th>
        </tr>
        {% for d in donors %}
        <tr>
            <td>{{ d["id"] }}</td>
            <td>{{ d["name"] }}</td>
            <td>{{ d["blood_group"] }}</td>
            <td>{{ d["city"] }}</td>
            <td>{{ d["phone"] }}</td>
            <td>{{ d["last_donated_date"] or "Never" }}</td>
            <td>
                <a href="/edit/{{ d['id'] }}">Edit</a>
                <form method="POST" action="/delete/{{ d['id'] }}" style="display:inline;"
                      onsubmit="return confirm('Delete this donor?');">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    <br><a href="/">Back to Home</a>
</body>
</html>
